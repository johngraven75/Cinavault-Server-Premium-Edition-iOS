name: iOS v2.13 Build 1.13 Simulator TEST

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, release/v2.13-build-1.13]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ios-v2-13-build-1-13-${{ github.ref }}
  cancel-in-progress: true

env:
  TEST_ARTIFACT_NAME: CinaVault-iOS-v2.13-Build-1.13-Test-Notes

jobs:
  test-build-evidence:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Initialize test notes
        run: |
          mkdir -p test-evidence package-staging
          cat > test-evidence/TEST-NOTES.md <<EOF
          # CinaVault iOS Test Notes

          - Public release: v2.13
          - Build: 1.13
          - Internal version: 2.0.13
          - iOS build number: 113
          - Commit: ${GITHUB_SHA}
          - Event: ${GITHUB_EVENT_NAME}
          - Started UTC: $(date -u +%Y-%m-%dT%H:%M:%SZ)

          ## Required checks
          Version identity, parity governance, project generation, dependency resolution,
          simulator build, shared-contract tests, complete unit tests, archive validation,
          checksums, and artifact inventory.
          EOF

      - name: Verify version identity
        run: |
          grep -F 'MARKETING_VERSION: 2.0.13' project.yml
          grep -F 'CURRENT_PROJECT_VERSION: 113' project.yml
          echo '- Version identity: PASS' >> test-evidence/TEST-NOTES.md

      - name: Install tooling
        run: |
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          sudo gem install cocoapods -v 1.16.2 --no-document

      - name: Run parity governance
        run: |
          python3 scripts/verify_project.py 2>&1 | tee test-evidence/parity-governance.log
          echo '- Parity governance: PASS' >> test-evidence/TEST-NOTES.md

      - name: Generate and resolve project
        run: |
          xcodegen generate 2>&1 | tee test-evidence/xcodegen.log
          pod install --repo-update 2>&1 | tee test-evidence/pod-install.log
          echo '- Project generation and dependencies: PASS' >> test-evidence/TEST-NOTES.md

      - name: Select simulator
        id: simulator
        run: |
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(device["udid"] for devices in data.values() for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPhone")))')"
          echo "device_id=${DEVICE_ID}" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: |
          xcodebuild -workspace CinaVaultIOS.xcworkspace -scheme CinaVaultIOS -configuration Debug -destination 'id=${{ steps.simulator.outputs.device_id }}' CODE_SIGNING_ALLOWED=NO build 2>&1 | tee test-evidence/ios-build.log
          xcodebuild -workspace CinaVaultIOS.xcworkspace -scheme CinaVaultIOS -configuration Debug -destination 'id=${{ steps.simulator.outputs.device_id }}' CODE_SIGNING_ALLOWED=NO test 2>&1 | tee test-evidence/ios-tests.log
          echo '- Simulator build and tests: PASS' >> test-evidence/TEST-NOTES.md

      - name: Stage installable Simulator TEST app
        run: |
          set -euo pipefail
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/CinaVault.app' -type d -print -quit)"
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" package-staging/CinaVault-iOS-v2.13-Build-1.13-Simulator-TEST.zip
          cat > package-staging/INSTALL-SIMULATOR-TEST.md <<'EOF'
          # Install the CinaVault iOS Simulator TEST

          This unsigned TEST build runs in Apple’s iOS Simulator. It cannot be installed
          on a physical iPhone or distributed through the App Store without Apple signing.

          1. Install Xcode on a Mac and launch an iPhone Simulator.
          2. Unzip `CinaVault-iOS-v2.13-Build-1.13-Simulator-TEST.zip`.
          3. Run `xcrun simctl install booted CinaVault.app`.
          4. Open CinaVault from the Simulator home screen.
          EOF
          shasum -a 256 package-staging/CinaVault-iOS-v2.13-Build-1.13-Simulator-TEST.zip > package-staging/SIMULATOR-SHA256SUMS.txt
          echo '- Simulator TEST package: PASS' >> test-evidence/TEST-NOTES.md

      - name: Create unsigned archive candidate
        run: |
          xcodebuild -workspace CinaVaultIOS.xcworkspace -scheme CinaVaultIOS -configuration Release -sdk iphoneos -archivePath package-staging/CinaVault-iOS-v2.13-Build-1.13.xcarchive CODE_SIGNING_ALLOWED=NO archive 2>&1 | tee test-evidence/ios-archive.log
          ditto -c -k --sequesterRsrc --keepParent package-staging/CinaVault-iOS-v2.13-Build-1.13.xcarchive package-staging/CinaVault-iOS-v2.13-Build-1.13-xcarchive.zip
          shasum -a 256 package-staging/*.zip | tee test-evidence/IOS-SHA256SUMS.txt
          echo '- Unsigned archive validation: PASS' >> test-evidence/TEST-NOTES.md

      - name: Finalize success notes
        if: success()
        run: |
          printf '\n## Final result\n- Result: PASS\n- Completed UTC: %s\n- Distribution signing remains required before App Store or device publication.\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> test-evidence/TEST-NOTES.md
          zip -j package-staging/CinaVault-iOS-v2.13-Build-1.13-Test-Notes.zip test-evidence/*

      - name: Record failure
        if: failure()
        run: |
          mkdir -p test-evidence
          printf '\n## Final result\n- Result: FAILED\n- Completed UTC: %s\n- Review workflow logs and attached evidence.\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> test-evidence/TEST-NOTES.md

      - name: Upload notes for every build
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.TEST_ARTIFACT_NAME }}
          path: test-evidence/
          if-no-files-found: error
          retention-days: 90

      - name: Upload archive candidate
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: CinaVault-iOS-v2.13-Build-1.13-Simulator-TEST
          path: package-staging/
          if-no-files-found: error
          retention-days: 30

      - name: Publish iOS v2.13 Build 1.13 Simulator TEST prerelease
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v2.0.13-ios-test
          target_commitish: ${{ github.sha }}
          name: CinaVault iOS v2.13 Build 1.13 — Simulator TEST
          prerelease: true
          generate_release_notes: true
          fail_on_unmatched_files: true
          body: |
            This prerelease contains an installable iOS Simulator TEST app, checksum,
            install notes, unsigned archive, and test evidence. Apple distribution
            signing remains required for App Store or physical-device installation.
          files: |
            package-staging/CinaVault-iOS-v2.13-Build-1.13-Simulator-TEST.zip
            package-staging/CinaVault-iOS-v2.13-Build-1.13-xcarchive.zip
            package-staging/CinaVault-iOS-v2.13-Build-1.13-Test-Notes.zip
            package-staging/INSTALL-SIMULATOR-TEST.md
            package-staging/SIMULATOR-SHA256SUMS.txt
            test-evidence/IOS-SHA256SUMS.txt
