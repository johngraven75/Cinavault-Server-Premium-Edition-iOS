name: Total Automation Baseline
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - run: git diff --check
      - shell: bash
        run: |
          if git grep -n -E '^(<<<<<<< |>>>>>>> )' -- .; then exit 1; fi
      - shell: bash
        run: |
          echo '### Repository stack detection' >> "$GITHUB_STEP_SUMMARY"
          for marker in '*.sln' '*.csproj' 'package.json' 'Cargo.toml' 'go.mod' 'pyproject.toml' 'requirements.txt' 'gradlew' 'build.gradle' 'build.gradle.kts' 'Package.swift'; do find . -maxdepth 4 -type f -name "$marker" -print >> "$GITHUB_STEP_SUMMARY" || true; done
      - shell: bash
        run: test -z "$(git status --porcelain)"
