name: iOS CI

on:
  push:
    branches:
      - main
      - "v2-*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-test-build:
    name: Governance, Test, and Build
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install project tooling
        run: |
          set -euo pipefail
          brew list xcodegen >/dev/null 2>&1 || brew install xcodegen
          sudo gem install cocoapods --no-document

      - name: End-to-end parity governance
        run: python3 scripts/verify_project.py

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Resolve Google Cast dependency
        run: pod install --repo-update

      - name: Build for iOS Simulator
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace CinaVaultIOS.xcworkspace \
            -scheme CinaVaultIOS \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build | tee ios-build.log

      - name: Select available iPhone simulator
        id: simulator
        shell: bash
        run: |
          set -euo pipefail
          DEVICE_ID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(device["udid"] for devices in data.values() for device in devices if device.get("isAvailable") and device.get("name", "").startswith("iPhone")))')"
          echo "device_id=${DEVICE_ID}" >> "$GITHUB_OUTPUT"

      - name: Run unit tests
        run: |
          set -euo pipefail
          xcodebuild \
            -workspace CinaVaultIOS.xcworkspace \
            -scheme CinaVaultIOS \
            -configuration Debug \
            -destination 'id=${{ steps.simulator.outputs.device_id }}' \
            CODE_SIGNING_ALLOWED=NO \
            test | tee ios-tests.log

      - name: Verify built application
        run: |
          set -euo pipefail
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*/Build/Products/Debug-iphonesimulator/CinaVault.app' -type d -print -quit)"
          test -n "$APP_PATH"
          test -f "$APP_PATH/CinaVault"
          du -sh "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" cinavault-ios-v2-build-2-simulator.zip
          shasum -a 256 cinavault-ios-v2-build-2-simulator.zip > cinavault-ios-v2-build-2-simulator.sha256

      - name: Upload simulator application
        uses: actions/upload-artifact@v4
        with:
          name: cinavault-ios-v2-build-2-simulator-${{ github.sha }}
          path: |
            cinavault-ios-v2-build-2-simulator.zip
            cinavault-ios-v2-build-2-simulator.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cinavault-ios-diagnostics-${{ github.sha }}
          path: |
            ios-build.log
            ios-tests.log
          if-no-files-found: ignore
          retention-days: 14
